<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Todo App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Optional font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>


  <!--<link rel="stylesheet" href="style.css" />-->
</head>

<body class="bg-dark-subtle">
  <main class="container my-4 my-md-5 app-wrap">

    <!-- Page Title -->
    <h2 class="app-title text-center mb-4">My Todo App</h2>

    <!-- Form Card (Skeleton) -->

    <section class="card shadow-sm form-card mb-4">
      <div class="card-body p-4">

        <div class="mb-3">
          <label class="form-label">Title</label>
          <input type="text" id="TodoTitle" class="form-control" />
        </div>

        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea id="descInput" class="form-control" rows="4"></textarea>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-12 col-md-6">
            <label class="form-label">Due Date</label>
            <div class="input-group">
              <input id="dueInput" type="datetime-local" class="form-control" />
              <span class="input-group-text bg-white">
                <i class="bi bi-calendar3"></i>
              </span>
            </div>
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label">Assign to Person (Optional)</label>
            <select id="personInput" class="form-select">
              <option>-- Select Person (Optional) --</option>
            </select>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Attachments</label>
          <div class="d-flex">
            <input id="filesInput" type="file" class="form-control rounded-end-0" multiple />
            <button type="button" class="btn btn-outline-secondary rounded-start-0">
              <i class="bi bi-x-lg"></i>
            </button>
          </div>
        </div>

        <div class="d-flex justify-content-end">
          <button id="addBtn" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>
            Add Todo
          </button>
        </div>

      </div>
    </section>

    <!-- ========================= -->
    <!-- Todos Card (Header Only) -->
    <!-- ========================= -->
    <section class="card shadow-sm">
      <section class="card shadow-sm">
        <div class="card-header d-flex bg-transparent align-items-center">
          <h4 class="h5 mb-0">ToDos</h4>

          <div class="btn-group bg-transparent ms-auto">
            <button id="filterBtn" class="btn btn-outline-secondary btn-sm">
              <i class="bi bi-funnel"></i>
            </button>

            <button id="sortBtn" class="btn btn-outline-secondary btn-sm">
              <i class="bi bi-sort-down"></i>
            </button>

            <button type="button" class="btn btn-outline-success btn-sm" title="Complete">
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>
        <div class="card-body">
          <div id="todosList" class="d-flex flex-column gap-2"></div>
        </div>
      </section>
    </section>
  </main>
  <script src="./script.js"></script>
</body>

</html>
